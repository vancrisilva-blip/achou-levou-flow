<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#111d3a"><title>Achou Levou Flow</title><style>*{box-sizing:border-box}body{margin:0;background:#fff6fa;color:#17213b;font-family:system-ui;padding-bottom:80px}.hero{background:#111d3a;color:#fff;padding:calc(24px + env(safe-area-inset-top)) 18px 25px;border-radius:0 0 28px 28px}.hero b{color:#ff3f9d}.wrap{padding:16px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.c{background:white;border:1px solid #efdee7;border-radius:17px;padding:15px}.c small{color:#777}.c strong{display:block;font-size:21px;margin-top:6px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eadbe3;display:grid;grid-template-columns:repeat(4,1fr);padding:10px 4px calc(10px + env(safe-area-inset-bottom))}.nav a{text-align:center;text-decoration:none;color:#60687b;font-size:12px}</style></head><body><header class="hero"><h1>Achou <b>Levou</b> Flow</h1><div>Painel privado da proprietária</div></header><main class="wrap"><h2>Resumo de hoje</h2><div class="grid" id="g"><div class="c">Carregando…</div></div></main><nav class="nav"><a href="/mobile.html">⌂<br>Início</a><a href="/operacao.html">✓<br>Aprovar</a><a href="/publicacoes.html">↗<br>Publicações</a><a href="/resumo.html">▦<br>Resumo</a></nav><script>fetch('/api/resumo-diario').then(r=>r.json()).then(x=>{const m=v=>v==null?'Sem dados':v;g.innerHTML=[['Comissão',x.commission==null?'Sem dados':Number(x.commission).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})],['Vendas',m(x.sales)],['Pedidos',m(x.orders)],['Cliques',m(x.clicks)],['Pendentes',x.pending],['Aprovados',x.approved],['Publicados',x.published]].map(v=>'<div class=c><small>'+v[0]+'</small><strong>'+v[1]+'</strong></div>').join('')})</script></body></html>
