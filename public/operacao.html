<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aprovação</title><style>body{font-family:system-ui;background:#fff6fa;color:#17213b;padding:18px}article{background:#fff;border-radius:16px;padding:16px;margin:10px 0}button{padding:11px;border:0;border-radius:10px;margin-right:6px}</style><h1>Aprovação de Conteúdo</h1><div id=l>Carregando…</div><script>async function load(){let a=await fetch('/api/itens/pendentes').then(r=>r.json());l.innerHTML=a.length?a.map(x=>'<article><b>'+x.title+'</b><p>'+(x.caption||'Sem legenda')+'</p><button onclick="act('+x.id+',\'aprovar\')">Aprovar</button><button onclick="act('+x.id+',\'rejeitar\')">Rejeitar</button></article>').join(''):'Nenhum conteúdo pendente.'}async function act(id,a){await fetch('/api/itens/'+id+'/'+a,{method:'POST'});load()}load()</script>
