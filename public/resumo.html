<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resumo Executivo</title><style>body{font-family:system-ui;background:#fff6fa;color:#17213b;margin:0}.h{background:#111d3a;color:white;padding:24px}.h b{color:#ff3f9d}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:16px}.c{background:white;padding:16px;border-radius:16px}</style><div class=h><h1>Resumo <b>Executivo</b></h1></div><div class=g id=g></div><script>fetch('/api/resumo-diario').then(r=>r.json()).then(x=>g.innerHTML=Object.entries(x).filter(([k])=>!['day','source'].includes(k)).map(([k,v])=>'<div class=c><small>'+k+'</small><h2>'+(v??'Sem dados')+'</h2></div>').join(''))</script>
