name: Corrigir arquivos de mídia
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/normalize-media.py
      - .github/workflows/media-repair.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar conversor JPEG
        run: python -m pip install Pillow==11.3.0
      - name: Converter e validar as mídias existentes
        run: python scripts/normalize-media.py
      - name: Preservar arquivos corrigidos no repositório
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/corrigidos
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve compatible JPEG copies for failed posts'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
          name: github-pages-repair-${{ github.run_id }}-${{ github.run_attempt }}
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-repair-${{ github.run_id }}-${{ github.run_attempt }}
